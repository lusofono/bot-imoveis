<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="{{BASE}}">
<title>bot_mail</title>
<style>
:root { --bg:#f5f6f8; --card:#fff; --text:#1c2230; --muted:#667085; --line:#e3e6eb; --accent:#2f5bea; --accent-text:#fff; --bad:#b42318; }
@media (prefers-color-scheme: dark) { :root { --bg:#101318; --card:#181d25; --text:#e7eaf0; --muted:#98a2b3; --line:#2a313c;
  --accent:#7c9cff; --accent-text:#0b1020; --bad:#fda29b; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
form { width: min(380px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
h1 { font-size: 20px; margin: 0 0 6px; }
p { color: var(--muted); margin: 0 0 16px; }
input { font: inherit; width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--text); margin-bottom: 12px; }
button { font: inherit; width: 100%; padding: 9px; border: 0; border-radius: 8px; background: var(--accent);
  color: var(--accent-text); cursor: pointer; }
#error { color: var(--bad); margin: 12px 0 0; }
</style>
</head>
<body>
<form id="login">
  <h1>bot_mail</h1>
  <p>Página privada. Escreve a password da página.</p>
  <input id="password" type="password" autocomplete="current-password" required autofocus aria-label="Password">
  <button type="submit">Entrar</button>
  <p id="error" hidden></p>
</form>
<script nonce="{{NONCE}}">
document.getElementById('login').addEventListener('submit', async event => {
  event.preventDefault();
  const error = document.getElementById('error');
  error.hidden = true;
  const response = await fetch('login', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: document.getElementById('password').value})});
  if (response.ok) { location.reload(); return; }
  const data = await response.json().catch(() => ({}));
  error.textContent = data.error || 'Não foi possível entrar.';
  error.hidden = false;
});
</script>
</body>
</html>
